<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lo mejor de 3 mundos — BRADOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.3.2/css/flag-icons.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="worlds" aria-labelledby="worlds-title">
        <div class="worlds__inner">
          <header class="worlds__heading">
            <p class="worlds__eyebrow">Nuestra mezcla</p>
            <h2 id="worlds-title">
              <span class="worlds__title-line">Lo mejor de</span>
              <span class="worlds__title-line worlds__title-last">3 mundos<span class="worlds__period">.</span></span>
            </h2>
            <p class="worlds__intro">
              Tres culturas se encuentran alrededor del fuego para crear un sabor
              con identidad propia.
            </p>
          </header>

          <div class="worlds__story">
            <div class="worlds__flags" aria-label="Perú, Estados Unidos y Chile">
              <figure class="worlds__flag-wrap">
                <span class="fi fi-pe worlds__flag" role="img" aria-label="Bandera de Perú"></span>
                <figcaption>Perú</figcaption>
              </figure>

              <span class="worlds__plus" aria-hidden="true">+</span>

              <figure class="worlds__flag-wrap">
                <span class="fi fi-us worlds__flag" role="img" aria-label="Bandera de Estados Unidos"></span>
                <figcaption>USA</figcaption>
              </figure>

              <span class="worlds__plus" aria-hidden="true">+</span>

              <figure class="worlds__flag-wrap">
                <span class="fi fi-cl worlds__flag" role="img" aria-label="Bandera de Chile"></span>
                <figcaption>Chile</figcaption>
              </figure>
            </div>

            <p class="worlds__blend">
              El fuego y la sazón peruana, la energía de las chicken wings
              americanas y la calidez chilena se juntan en una cocina hecha para
              compartir.
            </p>
          </div>

          <p class="worlds__signature" aria-label="Chicken and Wings">
            Chicken <span aria-hidden="true">&amp;</span> Wings
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
